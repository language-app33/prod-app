<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks
         the page rather than sliding over it, so the answer bar's bottom:0
         is already above it and nothing has to be lifted. Chrome and
         Android honour it; Safari does not, which is why the app measures
         the visual viewport as well and lifts the bar itself. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Taleb33</title>
    <meta name="description" content="Spaced repetition for language learning." />

    <!-- Colours the browser and status bar chrome, per display mode -->
    <meta name="theme-color" content="#F3F4FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121834" media="(prefers-color-scheme: dark)" />

    <!-- iOS standalone mode -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Taleb33" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

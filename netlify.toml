# Netlify picks this up automatically — no need to set anything in the dashboard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Sync endpoint. Must come before the catch-all below, or the SPA rewrite
# would swallow it.
[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

# Courses, decks and accounts.
[[redirects]]
  from = "/api/courses"
  to = "/.netlify/functions/courses"
  status = 200

# Single page app: serve index.html for any path that isn't a real file.
# Netlify checks for actual files first, so assets, the manifest and the
# service worker are unaffected by this.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served stale, or updates won't reach an
# installed app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Vite fingerprints these filenames, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
